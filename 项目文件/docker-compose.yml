# 一站式工作台 Docker Compose 配置
name: unified-workbench

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-unified_workbench}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-unified_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # Redis 缓存/队列
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FILE_STORAGE_PATH:-./data/files}:/data/files
      - ${FILE_BACKUPS_PATH:-./data/backups}:/data/backups
      - modelscope_cache:/home/workbench/.modelscope
      # 与 llama-cpp 共用同一份 GGUF 目录：后端负责写入（下载/删除），
      # llama-cpp 以 /models 只读扫描。两边必须指向同一个宿主目录。
      - ./data/gguf:/data/gguf
    environment:
      - TZ=Asia/Shanghai
      - RESERVED_DISK_SPACE_GB=${RESERVED_DISK_SPACE_GB:-10}
      - MAX_SHARE_FILE_SIZE_GB=${MAX_SHARE_FILE_SIZE_GB:-1}
    networks:
      - workbench

  # Celery 异步任务
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    # 健康检查：worker 不监听 8000 端口，继承自 backend 镜像的 curl :8000 检查恒为假阳性。
    # 改用 inspect ping 做真实就绪探测（要求 broker 可达且 worker 在线响应）。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping --timeout 5 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FILE_STORAGE_PATH:-./data/files}:/data/files
      # 预热任务要读 GGUF 落盘情况，与 backend / llama-cpp 共用同一目录
      - ./data/gguf:/data/gguf
      # 会后处理要跑 ASR（SenseVoice ONNX）与说话人分离（sherpa-onnx），
      # 与 backend 共用同一模型缓存卷
      - modelscope_cache:/home/workbench/.modelscope
    environment:
      - TZ=Asia/Shanghai
      - RESERVED_DISK_SPACE_GB=${RESERVED_DISK_SPACE_GB:-10}
      - MAX_SHARE_FILE_SIZE_GB=${MAX_SHARE_FILE_SIZE_GB:-1}
    networks:
      - workbench

  # Celery Beat 定时任务调度
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /tmp
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # 健康检查：显式禁用。beat 无监听端口、无 ping 接口；调度文件仅在计划变更时写入
    # （实测相邻两次采样 mtime 不变），不存在可靠探测手段。继承自 backend 镜像的
    # curl :8000 检查在此恒为假阳性。进程存活由 restart: unless-stopped 兜底，
    # broker 连通性由 celery worker 的 inspect ping 覆盖。
    healthcheck:
      disable: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workbench

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - workbench

  # MediaMTX 流媒体服务器
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8890:8890/udp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${HOST_IP:-host.docker.internal}"
    networks:
      - workbench

  # 本地 AI 推理引擎（llama.cpp，纯 CPU）
  # 选型理由：官方 server 镜像纯 CPU、零 GPU 库。
  # 带 GPU 支持的推理镜像会内置多个版本的 CUDA 运行库（可达数 GB），
  # 而 Apple Silicon + Docker Desktop 无法做 GPU 透传，那些库纯属死重。
  # router 模式：启动时不带 -m，按请求里的模型名动态载入/卸载；模型从 /models 目录发现。
  #   --models-max 1        同时最多载入 1 个模型
  #   --sleep-idle-seconds  空闲 30 分钟后自动卸载释放内存；频繁使用时模型保持载入，避免反复冷启动 18s
  #                         注意 /health、/props、/models、/metrics 不会唤醒模型，
  #                         因此状态轮询不会意外把它拉起来
  # 性能通用项（跨机器自适应，均已实测生效）：
  #   --cache-reuse 256：前缀缓存服务端能力（业务侧保证请求前缀固定即命中）
  #   --metrics：Prometheus 容量监控（router 模式端点为 /metrics?model=<模型名>）
  #   线程/GPU/上下文不写死：-t 默认按物理核自适应；GPU 环境可另加 -ngl；-c 内存足可调大
  #   KV 量化（-fa/-ctk/-ctv q8_0）在本 router 构建不可用：命令行被拒（invalid argument），
  #   preset 文件被忽略——如未来换非 router 模式或新版本支持，再启用以省 ~140MB KV 内存
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >
      --host 0.0.0.0
      --port 8080
      --models-dir /models
      --models-max 1
      --ctx-size 8192
      --sleep-idle-seconds 1800
      --cache-reuse 256
      --metrics
    ports:
      - "8080:8080"
    volumes:
      - ./data/gguf:/models
    environment:
      - TZ=Asia/Shanghai
    networks:
      - workbench

  # Nginx 反向代理
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - workbench

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  modelscope_cache:
    driver: local

networks:
  workbench:
    driver: bridge
