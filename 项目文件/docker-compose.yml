# 一站式工作台 Docker Compose 配置
name: unified-workbench

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-unified_workbench}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-unified_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # Redis 缓存/队列
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workbench

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FILE_STORAGE_PATH:-./data/files}:/data/files
      - ${FILE_BACKUPS_PATH:-./data/backups}:/data/backups
      - modelscope_cache:/home/workbench/.modelscope
    environment:
      - TZ=Asia/Shanghai
      - RESERVED_DISK_SPACE_GB=${RESERVED_DISK_SPACE_GB:-10}
      - MAX_SHARE_FILE_SIZE_GB=${MAX_SHARE_FILE_SIZE_GB:-1}
    networks:
      - workbench

  # Celery 异步任务
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    # 健康检查：worker 不监听 8000 端口，继承自 backend 镜像的 curl :8000 检查恒为假阳性。
    # 改用 inspect ping 做真实就绪探测（要求 broker 可达且 worker 在线响应）。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping --timeout 5 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FILE_STORAGE_PATH:-./data/files}:/data/files
    environment:
      - TZ=Asia/Shanghai
      - RESERVED_DISK_SPACE_GB=${RESERVED_DISK_SPACE_GB:-10}
      - MAX_SHARE_FILE_SIZE_GB=${MAX_SHARE_FILE_SIZE_GB:-1}
    networks:
      - workbench

  # Celery Beat 定时任务调度
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /tmp
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # 健康检查：显式禁用。beat 无监听端口、无 ping 接口；调度文件仅在计划变更时写入
    # （实测相邻两次采样 mtime 不变），不存在可靠探测手段。继承自 backend 镜像的
    # curl :8000 检查在此恒为假阳性。进程存活由 restart: unless-stopped 兜底，
    # broker 连通性由 celery worker 的 inspect ping 覆盖。
    healthcheck:
      disable: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workbench

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - workbench

  # MediaMTX 流媒体服务器
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8890:8890/udp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${HOST_IP:-host.docker.internal}"
    networks:
      - workbench

  # Ollama - AI 模型推理
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU 加速说明（默认不开，因为 Docker Desktop 不支持，会导致整个 compose 起不来）：
    #   - Linux + NVIDIA：在本服务下加
    #       deploy:
    #         resources:
    #           reservations:
    #             devices:
    #               - driver: nvidia
    #                 device_ids: ["0"]
    #                 capabilities: [gpu]
    #   - macOS / Windows 的 Docker Desktop 实测不支持 GPU 透传
    #     （`docker run --gpus all` 报 "no known GPU vendor found"），ollama 只能跑 CPU。
    #   - Apple Silicon 想要 Metal GPU 加速：在宿主机原生装 ollama（brew install ollama），
    #     不要放容器里；原生 ollama 会自动走 GPU。
    # 容器内 CPU 实测速率（本机 M5 / 10 核 / 16 GB / Docker VM 5.8 GB）：
    #   qwen2.5:0.5b 约 130 tok/s；qwen3.5:4b 约 24 tok/s 且容易因内存不足被系统杀掉。
    networks:
      - workbench

  # Nginx 反向代理
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - workbench

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  modelscope_cache:
    driver: local

networks:
  workbench:
    driver: bridge
